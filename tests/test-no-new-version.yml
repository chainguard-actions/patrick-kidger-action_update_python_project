name: Test - action fails gracefully without a Python project
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action internally runs actions/checkout@v2 which checks out this
      # repo. This repo has no pyproject.toml at root, so python -m build
      # will fail. The action should exit with a non-zero status.
      # This test verifies the action fails gracefully (does not hang or
      # produce unexpected output) when no Python project is present.
      - name: Run action expecting failure (no Python project)
        id: action
        uses: .
        continue-on-error: true
        with:
          python-version: "3.12"
          pypi-token: "fake-token-not-used"
          github-user: "fake-user"
          github-token: "fake-token"
          test-script: "python -c 'import sys; sys.exit(0)'"

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no Python project is present"
            exit 1
          fi
          echo "PASS: action correctly failed when no Python project is present"
