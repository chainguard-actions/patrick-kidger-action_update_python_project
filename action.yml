name: 'Update Python project: Check version / Test / git tag / GitHub Release / Deploy to PyPI'
author: 'Patrick Kidger'
description: 'Builds a Python projects, runs tests, and if successful tags and uploads to PyPI'
inputs:
  python-version:
    description: 'The version of Python to use.'
    required: true
  pypi-user:
    description: 'Your username on PyPI.'
    default: '__token__'
  pypi-token:
    description: 'A PyPI password or authentication token for your project.'
    required: true
  github-user:
    description: 'Your username on GitHub.'
    required: true
  github-token:
    description: 'A GitHub authentication token for your project.'
    required: true
  test-script:
    description: 'The script for the tests.'
    required: true
branding:
  icon: 'wind'
  color: 'yellow'
runs:
  using: "composite"
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Checkout code
      uses: chainguard-actions/actions-checkout@cb8b4f71d4f23febbe3347f6860f67c154995cad # v2
    - name: Set up Python ${{ inputs.python-version }}
      uses: chainguard-actions/actions-setup-python@c1869dcf3733fc23f862a7b6ebb625aba29b87e2 # v2
      with:
        python-version: ${{ inputs.python-version }}
    - name: Setup
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install build uv
        python -m build
    - name: Get versions
      id: get-versions
      shell: bash
      run: |
        python -c "
        import subprocess
        import tomllib

        vparse = lambda x: tuple(map(int, x.split('.')))

        with open('pyproject.toml', 'rb') as f:
            data = tomllib.load(f)
        name = data['project']['name']
        checkout_version = data['project']['version']

        pypi_version = subprocess.run(f'python -m pip index versions {name}',
                                      shell=True, capture_output=True).stdout
        pypi_version = pypi_version.split(b'\n', 1)[0].split(b' ')[1][1:-1].decode('utf-8')
        new_version = str(vparse(checkout_version) > vparse(pypi_version)).lower()
        subprocess.run(f'echo name={name} >> $GITHUB_OUTPUT', shell=True)
        subprocess.run(f'echo tag=v{checkout_version} >> $GITHUB_OUTPUT', shell=True)
        subprocess.run(f'echo new-version={new_version} >> $GITHUB_OUTPUT', shell=True)
        print(f'Got checkout_version={vparse(checkout_version)!r}')
        print(f'Got pypi_version={vparse(pypi_version)!r}')
        print(f'Setting name={name}')
        print(f'Setting tag=v{checkout_version}')
        print(f'Setting new-version={new_version}')
        "
    - name: Test sdist
      id: test-sdist
      if: steps.get-versions.outputs.new-version == 'true'
      env:
        GITHUB_WORKSPACE_PATH: ${{ github.workspace }}
        TEST_SCRIPT: ${{ inputs.test-script }}
      shell: bash
      run: |
        cd $(mktemp -d)
        python -m uv venv
        python -m uv pip install "$GITHUB_WORKSPACE_PATH"/dist/*.tar.gz --target .venv/lib/*/site-packages/
        set +e
        _test_script_file=$(mktemp --suffix=.sh)
        printf '%s' "$TEST_SCRIPT" > "$_test_script_file"
        bash "$_test_script_file"
        if [ "$?" -eq 0 ]
        then
            echo result=true >> $GITHUB_OUTPUT
        else
            echo result=false >> $GITHUB_OUTPUT
        fi
        rm -f "$_test_script_file"
        set -e
        cd "$GITHUB_WORKSPACE_PATH"
    - name: Test bdist_wheel
      id: test-bdist-wheel
      if: steps.get-versions.outputs.new-version == 'true'
      env:
        GITHUB_WORKSPACE_PATH: ${{ github.workspace }}
        TEST_SCRIPT: ${{ inputs.test-script }}
      shell: bash
      run: |
        cd $(mktemp -d)
        python -m uv venv
        python -m uv pip install "$GITHUB_WORKSPACE_PATH"/dist/*.whl --target .venv/lib/*/site-packages/
        set +e
        _test_script_file=$(mktemp --suffix=.sh)
        printf '%s' "$TEST_SCRIPT" > "$_test_script_file"
        bash "$_test_script_file"
        if [ "$?" -eq 0 ]
        then
            echo result=true >> $GITHUB_OUTPUT
        else
            echo result=false >> $GITHUB_OUTPUT
        fi
        rm -f "$_test_script_file"
        set -e
        cd "$GITHUB_WORKSPACE_PATH"
    - name: Logging
      env:
        NEW_VERSION: ${{ steps.get-versions.outputs.new-version }}
        SDIST_RESULT: ${{ steps.test-sdist.outputs.result }}
        BDIST_RESULT: ${{ steps.test-bdist-wheel.outputs.result }}
      shell: bash
      run: |
        echo "new-version=$NEW_VERSION"
        echo "sdist-result=$SDIST_RESULT"
        echo "bdist-result=$BDIST_RESULT"
    - name: Push to PyPI
      if: (steps.get-versions.outputs.new-version == 'true') && (steps.test-sdist.outputs.result == 'true') && (steps.test-bdist-wheel.outputs.result == 'true')
      env:
        TWINE_USERNAME: ${{ inputs.pypi-user }}
        TWINE_PASSWORD: ${{ inputs.pypi-token }}
      shell: bash
      run: |
        python -m pip install twine
        python -m twine upload dist/*
    - name: Tag
      if: (steps.get-versions.outputs.new-version == 'true') && (steps.test-sdist.outputs.result == 'true') && (steps.test-bdist-wheel.outputs.result == 'true')
      env:
        GIT_TAG: ${{ steps.get-versions.outputs.tag }}
        GITHUB_USER: ${{ inputs.github-user }}
        GITHUB_TOKEN_VALUE: ${{ inputs.github-token }}
        GITHUB_REPOSITORY_NAME: ${{ github.repository }}
      shell: bash
      run: |
        git config --global user.email "noreply@example.com"
        git config --global user.name "Action: Update Python project"
        git tag "$GIT_TAG" -m ""
        git push "https://${GITHUB_USER}:${GITHUB_TOKEN_VALUE}@github.com/${GITHUB_REPOSITORY_NAME}" "$GIT_TAG"
    - name: GitHub release
      if: (steps.get-versions.outputs.new-version == 'true') && (steps.test-sdist.outputs.result == 'true') && (steps.test-bdist-wheel.outputs.result == 'true')
      uses: chainguard-actions/softprops-action-gh-release@008d986dff0405b1fa98d7b5ccaa8361e486972a # v1
      with:
        name: "${{ steps.get-versions.outputs.name }} ${{ steps.get-versions.outputs.tag }}"
        body: "Autogenerated release notes as follows:"
        tag_name: "${{ steps.get-versions.outputs.tag }}"
        token: ${{ inputs.github-token }}
        generate_release_notes: true
    - name: Fail
      if: (steps.get-versions.outputs.new-version == 'true') && ((steps.test-sdist.outputs.result != 'true') || (steps.test-bdist-wheel.outputs.result != 'true'))
      shell: bash
      run: exit 1
